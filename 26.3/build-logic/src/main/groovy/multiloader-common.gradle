plugins {
    id 'java-library'
}

// 2.30.1+fabric.0, 2.30.1+neoforge.0 (common gets 2.30.1+common.0, it is never shipped)
version = "${mod_version}+${project.name}.${port_revision}"

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

repositories {
    mavenCentral()
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { name = 'Ladysnake'; url = 'https://maven.ladysnake.org/releases' } // Cardinal Components
    maven { name = 'TheIllusiveC4'; url = 'https://maven.theillusivec4.top/' } // Curios
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/'; content { includeGroupAndSubgroups 'net.fabricmc' } } // Mixin, loader annotations
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

// License and the list of changes from upstream ship in every jar (license: mark all modifications).
tasks.withType(Jar).configureEach {
    from(rootProject.file('../LICENSE.md'))
    from(rootProject.file('../CHANGES.md'))
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_id'                       : mod_id,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'java_version'                 : java_version
    ]

    filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}
