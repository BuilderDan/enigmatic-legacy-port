modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="LicenseRef-Enigmatic-Legacy-License-II"
issueTrackerURL="https://github.com/BuilderDan/enigmatic-legacy-port/issues"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="Enigmatic Legacy (NeoForge port)"
displayURL="https://modrinth.com/mod/enigmatic-legacy"
bannerFile="EL_logo.png"
authors="Aizistral (original author and owner); BuilderDan (NeoForge port)"
description='''
Unofficial NeoForge port of Enigmatic Legacy. Enigmatic Legacy is created and owned by Aizistral (Aizistral Studios); this port is not affiliated with them.
'''

[[mixins]]
config="enigmaticlegacy.mixins.json"

[[mixins]]
config="enigmaticlegacy.neoforge.mixins.json"

[[mixins]]
config="enigmaticlegacy.dev.mixins.json"

[[mixins]]
config="enigmaticlegacy.patchouli.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="required"
versionRange="[17.0.0-beta.3,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="patchouli"
type="optional"
ordering="NONE"
side="BOTH"
