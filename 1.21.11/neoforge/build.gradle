plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('run'))
            devProperties(true).each { k, v -> systemProperty(k, v.toString()) }
        }
        server {
            server()
            gameDirectory = this.mkdir(this.file('run-server'))
            programArgument('--nogui')
            devProperties(false).each { k, v -> systemProperty(k, v.toString()) }
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Upstream's slot API: rings, charms, scrolls, spellstones, back slot.
    implementation("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    // Common code carries Fabric's @Environment annotations and optional Patchouli mixins.
    compileOnly("net.fabricmc:fabric-loader:${fabric_loader_version}")
    compileOnly("maven.modrinth:patchouli:AveV4Tjn")
}

// Dan: dev clients only on the 2nd monitor. FML's early loading window opens on the main one before DevMixinWindow runs.
tasks.matching { it.name == 'runClient' }.configureEach { doFirst {
    prepareDevClient(file('run'))
    forceKeys(file('run/config/fml.toml'), ['earlyWindowControl': 'false'], ' = ')
} }
tasks.matching { it.name == 'runServer' }.configureEach { doFirst { prepareDevServer(file('run-server')) } }

// mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
