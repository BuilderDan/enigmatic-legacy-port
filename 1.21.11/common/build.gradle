plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// Vanilla-only code and the shared assets/data. Loader code goes through the platform interfaces
// (com.aizistral.enigmaticlegacy.platform), implemented in :fabric and :neoforge.
neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Fabric and NeoForge both bundle Fabric Mixin and MixinExtras, so common may use them.
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))
    // Only for the @Environment(EnvType.CLIENT) markers kept from the Fabric port (CLASS retention,
    // ignored on NeoForge; Fabric Loader strips client-only members with them on dedicated servers).
    compileOnly("net.fabricmc:fabric-loader:${fabric_loader_version}")
    // Patchouli (The Acknowledgment guide book) has no 1.21.11 build; compile the optional
    // integration against the 26.1 Fabric build (Identifier-based API, closest to 1.21.11). All use is guarded by PatchouliState / a class lookup.
    compileOnly("maven.modrinth:patchouli:AveV4Tjn")
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
