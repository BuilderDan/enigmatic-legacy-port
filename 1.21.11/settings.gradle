pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Layout from jaredlll08/MultiLoader-Template (branch 1.21.11).
rootProject.name = 'enigmaticlegacy-1.21.11'
includeBuild('build-logic')
include('common')
include('fabric')
include('neoforge')
